name: SITL Tests (SIH)

on:
  push:
    branches:
    - 'main'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
    - '**'
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testing PX4 SIH
    runs-on: [runs-on,runner=2cpu-linux-x64,image=ubuntu24-full-x64,"run-id=${{ github.run_id }}"]
    container:
      image: px4io/px4-dev:v1.17.0-rc2
    env:
      PX4_CMAKE_BUILD_TYPE: RelWithDebInfo
      PX4_SBOM_DISABLE: 1

    steps:
      - uses: runs-on/action@v2
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Configure Git Safe Directory
        run: git config --system --add safe.directory '*'

      - uses: ./.github/actions/setup-ccache
        id: ccache
        with:
          cache-key-prefix: ccache-sitl-sih
          max-size: 200M

      - name: Download MAVSDK
        run: wget "https://github.com/mavlink/MAVSDK/releases/download/v$(cat test/mavsdk_tests/MAVSDK_VERSION)/libmavsdk-dev_$(cat test/mavsdk_tests/MAVSDK_VERSION)_ubuntu20.04_amd64.deb"

      - name: Install MAVSDK
        run: dpkg -i "libmavsdk-dev_$(cat test/mavsdk_tests/MAVSDK_VERSION)_ubuntu20.04_amd64.deb"

      - name: Build PX4 SIH and MAVSDK tests
        run: make px4_sitl_sih mavsdk_tests

      - uses: ./.github/actions/save-ccache
        if: always()
        with:
          cache-primary-key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Run SIH tests
        run: >
          python3 test/mavsdk_tests/sih_test_runner.py
          --speed-factor 10
          --build-dir build/px4_sitl_sih
          --model quadx
          --test-filter "[ekf2_selector]"
          --log-dir logs
        timeout-minutes: 10

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sih-test-logs
          path: |
            logs/
            build/px4_sitl_sih/tmp_sih_tests/rootfs/log/**/*.ulg
